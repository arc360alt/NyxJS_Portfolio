<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nyx · Full stack developer</title>
    <meta name="description" content="Nyx (NyxJS) — full stack developer from Chicago making open source apps, games and websites." />
    <meta name="theme-color" content="#fcf8fe" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Paint the saved theme before the app loads, so there's no flash of the wrong colors.
      try {
        var cache = JSON.parse(localStorage.getItem('nyx:theme-cache') || 'null');
        var mode = localStorage.getItem('nyx:theme-mode') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        if (cache && cache.dark === dark && typeof cache.css === 'string') root.setAttribute('style', (root.getAttribute('style') || '') + ';' + cache.css);
      } catch (e) {
        if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght,ROND@6..144,25..151,100..1000,0..100&display=swap" />
    <link rel="stylesheet" href="%MATERIAL_SYMBOLS_HREF%" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px">Nyx — full stack developer from Chicago. This site needs JavaScript for its interactive visor.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
